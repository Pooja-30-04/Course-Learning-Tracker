{% extends 'base.html' %}

{% block title %}Sign In - CourseTracker{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[70vh] py-12 animate-fade-in-down">
    <div class="bg-white p-8 md:p-10 rounded-3xl shadow-lg border border-gray-100 max-w-md w-full">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-gray-900 mb-2">Welcome Back</h2>
            <p class="text-gray-500">Sign in to continue your learning journey</p>
        </div>

        <form method="post" class="space-y-6">
            {% csrf_token %}

            {% if form.errors %}
            <div class="bg-red-50 text-red-600 p-4 rounded-xl text-sm mb-4">
                Please correct the errors below.
            </div>
            {% endif %}

            <div>
                <label for="id_username" class="block text-sm font-semibold text-gray-700 mb-2">Username</label>
                <input type="text" name="username" id="id_username" required
                    class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all">
            </div>

            <div>
                <label for="id_password" class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                <input type="password" name="password" id="id_password" required
                    class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all">
            </div>

            <button type="submit"
                class="w-full bg-gradient-to-r from-brand-600 to-indigo-600 text-white font-bold py-3 px-4 rounded-xl shadow-md hover:shadow-lg hover:scale-[1.02] transition-all">
                Sign In
            </button>
        </form>

        <p class="mt-8 text-center text-sm text-gray-600">
            Don't have an account? <a href="{% url 'register' %}"
                class="text-brand-600 font-bold hover:underline transition-colors">Sign up</a>
        </p>
    </div>
</div>
{% endblock %}
